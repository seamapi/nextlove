name: NPM Semantic Release
on:
  push:
    branches:
      - main
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Required for @semantic-release/git to push the release commit and tag.
      contents: write
      # Required for npm trusted publishing (OIDC): lets the job mint the
      # id-token that is exchanged for a short-lived npm publish token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: cd packages/nextlove && yarn install
      - run: cd packages/nextlove && yarn build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd packages/nextlove && npx semantic-release
